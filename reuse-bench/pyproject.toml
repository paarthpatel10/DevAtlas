[project]
name = "reuse-bench"
version = "0.1.0"
description = "Benchmark: do coding agents surface existing open-source tools before writing custom code?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
reuse-bench = "reuse_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default Windows temp dir is not writable in some sandboxes; keep tmp inside the project.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
# Case workspaces are contributors' starter projects, kept exactly as provided.
extend-exclude = ["workspaces"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
