date_observed: "2026-11"
stack:
  language: python
  python_version: "3.12"
  frameworks: [httpx]
context: |
  A small service that pulls exchange rates from a third-party HTTP API every few minutes.
  The API sometimes times out or answers with 502 and 503 errors for a few seconds.
request: |
  Calls to the rates API sometimes fail for a few seconds. Make every outbound call retry
  automatically on timeouts and 5xx responses, waiting a little longer before each new
  attempt, with some randomness in the wait, and give up after five attempts.
