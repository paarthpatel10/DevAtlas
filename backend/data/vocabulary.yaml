# Vocabulary for the deterministic (demo-mode) query understanding.
#
# stack_terms: technologies a user may already use. role groups them; language is the
#   language the technology implies (used only for "inferred" compatibility notes).
# capabilities: requirement concepts. `triggers` detect the concept in a query and are also
#   searched for in repository text as evidence; `expansions` add generic technical
#   synonyms for retrieval. Expansions must NOT contain product names, so that
#   recommendations come from repository content, not from this dictionary.
# licenses: phrases mapped to SPDX ids (used only when the query talks about licensing).

stack_terms:
  Python: {role: language, language: Python, aliases: [python]}
  TypeScript: {role: language, language: TypeScript, aliases: [typescript]}
  JavaScript: {role: language, language: JavaScript, aliases: [javascript, node.js, nodejs, node]}
  Go: {role: language, language: Go, aliases: [golang]}
  Rust: {role: language, language: Rust, aliases: [rust]}
  Java: {role: language, language: Java, aliases: [java]}
  FastAPI: {role: backend, language: Python, aliases: [fastapi, fast api]}
  Django: {role: backend, language: Python, aliases: [django]}
  Flask: {role: backend, language: Python, aliases: [flask]}
  Express: {role: backend, language: JavaScript, aliases: [express, express.js, expressjs]}
  NestJS: {role: backend, language: TypeScript, aliases: [nestjs, nest.js]}
  Spring Boot: {role: backend, language: Java, aliases: [spring boot, spring]}
  Next.js: {role: frontend, language: TypeScript, aliases: [next.js, nextjs, next js]}
  React: {role: frontend, language: TypeScript, aliases: [react, react.js, reactjs]}
  Vue: {role: frontend, language: TypeScript, aliases: [vue, vue.js, vuejs]}
  Svelte: {role: frontend, language: TypeScript, aliases: [svelte, sveltekit]}
  PostgreSQL: {role: database, aliases: [postgresql, postgres, pg]}
  MySQL: {role: database, aliases: [mysql]}
  SQLite: {role: database, aliases: [sqlite]}
  Redis: {role: database, aliases: [redis]}
  MongoDB: {role: database, aliases: [mongodb, mongo]}
  Kubernetes: {role: infrastructure, aliases: [kubernetes, k8s]}
  Docker: {role: infrastructure, aliases: [docker, containers]}
  AWS: {role: infrastructure, aliases: [aws, amazon web services]}
  JWT: {role: auth, aliases: [jwt, json web token, json web tokens]}

